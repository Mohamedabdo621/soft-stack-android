name: Build SOFT STACK APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'copilot/**'
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.css'
      - '**/*.html'
      - '**/*.json'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/AndroidManifest.xml'
      - 'capacitor.config.*'
      - 'package-lock.json'
      - 'soft-stack-nov-18-2026-3-46-07-am.zip'
      - 'soft-stack-icon.png'
      - 'scripts/generate_android_icons.py'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract archived source when needed
        shell: bash
        run: |
          if [[ ! -f package.json && -f soft-stack-nov-18-2026-3-46-07-am.zip ]]; then
            unzip -q soft-stack-nov-18-2026-3-46-07-am.zip -d .
          fi
          test -f package.json

      - name: Install web dependencies
        run: npm ci

      - name: Generate Android launcher icons
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 scripts/generate_android_icons.py

      - name: Type-check and build web app
        run: |
          npm run lint
          npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK metadata
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='com.softstack.game'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOFT-STACK-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
